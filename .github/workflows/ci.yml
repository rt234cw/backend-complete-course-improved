name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DOTENV_PATH: .env.test

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: watchlist_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d watchlist_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run format:check

      - name: openapi.json is up to date (npm run openapi:export)
        run: npm run openapi:export && git diff --exit-code openapi.json

      - run: npm run typecheck

      - run: npm run test:coverage

      - run: npm run build

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: API types are up to date (npm run api:types)
        run: npm run api:types && git diff --exit-code src/api/schema.d.ts

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build
